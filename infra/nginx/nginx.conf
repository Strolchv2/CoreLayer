# Reverse proxy for CoreLayer. Privacy-relevant settings are marked [privacy].
worker_processes auto;
pid /tmp/nginx.pid;

# [privacy] Only critical errors; no per-request error noise.
error_log /dev/stderr crit;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # [privacy] No access log. Ever.
  access_log off;
  log_not_found off;
  log_subrequest off;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip off; # avoid compression side channels on encrypted payloads

  # Several relay nodes (docker compose replicas) resolve behind this name.
  upstream relay {
    server relay:3000;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    return 301 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    # Add "listen [::]:8080;" / "listen [::]:8443 ssl;" on hosts with IPv6.
    http2 on;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off; # tickets would weaken forward secrecy of TLS

    # --- Security headers (apply to every response) ---------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), serial=(), hid=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), display-capture=(), browsing-topics=(), interest-cohort=()" always;
    add_header X-DNS-Prefetch-Control "off" always;

    root /usr/share/nginx/html;

    location /api/ {
      client_max_body_size 12m;
      proxy_pass http://relay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (never append) so clients cannot spoof it. Used only for
      # in-memory rate limiting by the relay; never stored.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      # The relay sends its own security headers (for standalone use); the
      # proxy's headers above take precedence, so drop the duplicates.
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_hide_header Cross-Origin-Resource-Policy;
      proxy_hide_header X-DNS-Prefetch-Control;
    }

    location = /ws {
      proxy_pass http://relay;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 120s;
    }

    # Content-hashed build output can be cached forever.
    location /assets/ {
      expires max;
    }

    location / {
      expires -1;
      try_files $uri /index.html;
    }
  }
}
