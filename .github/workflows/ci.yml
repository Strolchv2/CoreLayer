name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corelayer
          POSTGRES_PASSWORD: corelayer
          POSTGRES_DB: corelayer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corelayer"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://corelayer:corelayer@127.0.0.1:5432/corelayer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
